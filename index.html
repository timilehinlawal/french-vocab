<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>French Vocab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("fv-theme");
        document.documentElement.dataset.theme = ["light", "rain", "lofi", "night"].indexOf(t) >= 0 ? t : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      .boot {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f2efe9;
        color: #1a1a1a;
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
      }
      :root[data-theme="night"] .boot,
      :root[data-theme="lofi"] .boot,
      :root[data-theme="rain"] .boot {
        background: #0e0e0e;
        color: #ececec;
      }
      :root[data-theme="rain"] .boot {
        background: #271a10;
      }
      :root[data-theme="lofi"] .boot {
        background: #9aa4b0;
      }
      .boot-mark {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.04em;
        background: color-mix(in srgb, currentColor 10%, transparent);
        animation: boot-pulse 1.4s ease-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <span class="boot-mark" aria-hidden="true">fr</span>
      </div>
    </div>
    <noscript>french vocab needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
